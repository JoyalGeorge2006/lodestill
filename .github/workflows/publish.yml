name: publish
# Manual only. Publishes the already signed and device-verified APK from a
# build run. Nothing is public until this workflow is dispatched.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "build run id (dispatch run with sign + release-verify green)"
        required: true
      tag:
        description: "release tag, e.g. v0.2.0-amoled"
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require green signing and device verification on that run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=${{ inputs.run_id }}
          gh api repos/${{ github.repository }}/actions/runs/$RUN/jobs --jq '.jobs[]|"\(.name) \(.conclusion)"'
          for J in test apk emulator sign release-verify; do
            C=$(gh api repos/${{ github.repository }}/actions/runs/$RUN/jobs --jq ".jobs[]|select(.name==\"$J\")|.conclusion")
            [ "$C" = "success" ] || { echo "job $J is '$C', refusing to publish"; exit 1; }
          done
          gh api repos/${{ github.repository }}/actions/runs/$RUN --jq .head_sha > sha.txt
      - uses: actions/download-artifact@v4
        with:
          name: lodestill-release-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the artifact hash matches the recorded one
        run: |
          APK=$(find . -name app-release.apk | head -1)
          sha256sum "$APK"; cat $(find . -name release-sha256.txt | head -1)
          [ "$(sha256sum "$APK" | cut -d' ' -f1)" = "$(cut -d' ' -f1 $(find . -name release-sha256.txt | head -1))" ]
          cp "$APK" "Lodestill-${{ inputs.tag }}.apk"
      - name: Create prerelease with the verified APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" "Lodestill-${{ inputs.tag }}.apk" --repo ${{ github.repository }} --target "$(cat sha.txt)" --title "Lodestill ${{ inputs.tag }}" --prerelease --notes "Signed test build of Lodestill. First install only. Emulator-tested; not tested on a real phone."
      - name: Verify public URL serves the identical APK
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/Lodestill-${{ inputs.tag }}.apk"
          curl -sL "$URL" -o /tmp/public.apk
          PUB=$(sha256sum /tmp/public.apk | cut -d' ' -f1); LOCAL=$(sha256sum Lodestill-${{ inputs.tag }}.apk | cut -d' ' -f1)
          echo "public $PUB"; echo "local  $LOCAL"
          [ "$PUB" = "$LOCAL" ] && echo "PUBLIC URL HASH MATCH: $URL"
