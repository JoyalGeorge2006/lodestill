name: build
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:testDebugUnitTest --stacktrace
  apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lodestill-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  emulator:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant dev.joyal.lodestill.debug android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.joyal.lodestill.debug android:get_usage_stats allow
            adb shell appops set dev.joyal.lodestill.debug SYSTEM_ALERT_WINDOW allow
            adb shell settings put secure enabled_accessibility_services dev.joyal.lodestill.debug/dev.joyal.lodestill.service.BlockAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            rm -f /tmp/lodestill_test_failed
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.joyal.lodestill.ProcessDeathSetupTest,dev.joyal.lodestill.ProcessDeathVerifyTest --stacktrace || touch /tmp/lodestill_test_failed
            mkdir -p testxml && cp -r app/build/outputs/androidTest-results/connected testxml/main
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant dev.joyal.lodestill.debug android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.joyal.lodestill.debug android:get_usage_stats allow
            adb shell appops set dev.joyal.lodestill.debug SYSTEM_ALERT_WINDOW allow
            adb shell settings put secure enabled_accessibility_services dev.joyal.lodestill.debug/dev.joyal.lodestill.service.BlockAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell pm list packages | grep dev.joyal.lodestill
            OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.ProcessDeathSetupTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed
            adb shell input keyevent KEYCODE_HOME
            adb shell am force-stop dev.joyal.lodestill.debug
            sleep 3
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 8
            OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.ProcessDeathVerifyTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed
            adb logcat -d > testxml/logcat.txt
            mkdir -p shots
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 8
            adb exec-out screencap -p > shots/app_light.png
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 400
            sleep 3
            adb exec-out screencap -p > shots/launcher_light.png
            adb shell cmd uimode night yes
            sleep 3
            adb exec-out screencap -p > shots/launcher_dark.png
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 5
            adb exec-out screencap -p > shots/app_dark.png
            adb shell cmd uimode night no
            if [ -f /tmp/lodestill_test_failed ]; then echo "device tests FAILED"; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: testxml/
