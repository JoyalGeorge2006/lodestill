name: build
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --stacktrace
  apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lodestill-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  emulator:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant dev.joyal.lodestill.debug android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.joyal.lodestill.debug android:get_usage_stats allow
            adb shell appops set dev.joyal.lodestill.debug SYSTEM_ALERT_WINDOW allow
            adb shell settings put secure enabled_accessibility_services dev.joyal.lodestill.debug/dev.joyal.lodestill.service.BlockAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            rm -f /tmp/lodestill_test_failed
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.joyal.lodestill.ProcessDeathSetupTest,dev.joyal.lodestill.ProcessDeathVerifyTest,dev.joyal.lodestill.BlockScenarioSetupTest,dev.joyal.lodestill.BlockScenarioTeardownTest,dev.joyal.lodestill.ScreenshotTest --stacktrace || touch /tmp/lodestill_test_failed
            mkdir -p testxml && cp -r app/build/outputs/androidTest-results/connected testxml/main
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant dev.joyal.lodestill.debug android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.joyal.lodestill.debug android:get_usage_stats allow
            adb shell appops set dev.joyal.lodestill.debug SYSTEM_ALERT_WINDOW allow
            adb shell settings put secure enabled_accessibility_services dev.joyal.lodestill.debug/dev.joyal.lodestill.service.BlockAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            rm -f /tmp/lodestill_sel /tmp/lodestill_unsel; for p in com.google.android.deskclock com.android.deskclock com.google.android.calculator com.android.calculator2 com.android.camera2; do if adb shell pm path $p 2>/dev/null | grep -q "package:"; then echo $p > /tmp/lodestill_sel; break; fi; done; echo "selected target: $(cat /tmp/lodestill_sel 2>/dev/null)"; [ -s /tmp/lodestill_sel ] || touch /tmp/lodestill_test_failed
            for p in com.android.camera2 com.google.android.deskclock com.android.deskclock com.google.android.calculator com.android.calculator2; do if adb shell pm path $p 2>/dev/null | grep -q "package:" && [ "$p" != "$(cat /tmp/lodestill_sel 2>/dev/null)" ]; then echo $p > /tmp/lodestill_unsel; break; fi; done; echo "unselected target: $(cat /tmp/lodestill_unsel 2>/dev/null)"; [ -s /tmp/lodestill_unsel ] || touch /tmp/lodestill_test_failed
            if [ -s /tmp/lodestill_sel ]; then OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.BlockScenarioSetupTest -e selected $(cat /tmp/lodestill_sel) dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed; fi
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 > /dev/null || touch /tmp/lodestill_test_failed
            sleep 4
            adb shell settings delete secure enabled_accessibility_services || touch /tmp/lodestill_test_failed
            adb shell settings put secure accessibility_enabled 0 || touch /tmp/lodestill_test_failed
            adb shell settings put secure enabled_accessibility_services dev.joyal.lodestill.debug/dev.joyal.lodestill.service.BlockAccessibilityService || touch /tmp/lodestill_test_failed
            adb shell settings put secure accessibility_enabled 1 || touch /tmp/lodestill_test_failed
            sleep 5
            echo "a11y list now: $(adb shell settings get secure enabled_accessibility_services), master: $(adb shell settings get secure accessibility_enabled)"; BINDS=$(adb shell logcat -d | grep -c "BlockSvc: connected" || true); echo "BlockSvc connected lines so far: $BINDS"; adb shell logcat -d | grep "BlockSvc" | tail -5
            if [ -s /tmp/lodestill_unsel ]; then adb shell monkey -p $(cat /tmp/lodestill_unsel) -c android.intent.category.LAUNCHER 1 > /dev/null || touch /tmp/lodestill_test_failed; fi
            sleep 6
            FOCUS=$(adb shell dumpsys window | grep -E "mCurrentFocus"); echo "unselected focus: $FOCUS"; echo "$FOCUS" | grep -q "$(cat /tmp/lodestill_unsel 2>/dev/null)" || touch /tmp/lodestill_test_failed
            if [ -s /tmp/lodestill_sel ]; then adb shell monkey -p $(cat /tmp/lodestill_sel) -c android.intent.category.LAUNCHER 1 > /dev/null || touch /tmp/lodestill_test_failed; fi
            sleep 8
            FOCUS=$(adb shell dumpsys window | grep -E "mCurrentFocus"); echo "selected focus: $FOCUS"; echo "$FOCUS" | grep -q "dev.joyal.lodestill" || touch /tmp/lodestill_test_failed
            OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.BlockScenarioTeardownTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed
            adb shell pm list packages | grep dev.joyal.lodestill
            OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.ProcessDeathSetupTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed
            adb shell input keyevent KEYCODE_HOME
            adb shell am force-stop dev.joyal.lodestill.debug
            sleep 3
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 8
            OUT=$(adb shell am instrument -w -e class dev.joyal.lodestill.ProcessDeathVerifyTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$OUT"; echo "$OUT" | grep -q "OK (" || touch /tmp/lodestill_test_failed
            adb logcat -d > testxml/logcat.txt
            adb shell dumpsys accessibility > testxml/dumpsys-accessibility.txt 2>&1 || true
            adb shell settings get secure enabled_accessibility_services > testxml/enabled-a11y-services.txt 2>&1 || true
            mkdir -p shots/ui
            adb shell am instrument -w -e class dev.joyal.lodestill.ScreenshotTest dev.joyal.lodestill.debug.test/androidx.test.runner.AndroidJUnitRunner || true
            adb pull /sdcard/Android/data/dev.joyal.lodestill.debug/files/shots/. shots/ui/ || true
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 8
            adb exec-out screencap -p > shots/app_light.png
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input swipe $((W/2)) $((H*3/5)) $((W/2)) $((H/4)) 400; sleep 2; adb exec-out screencap -p > shots/app_today_scrolled.png
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input tap $((W*3/8)) $((H*15/16)); sleep 3; adb exec-out screencap -p > shots/screen_places.png
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input tap $((W*5/8)) $((H*15/16)); sleep 3; adb exec-out screencap -p > shots/screen_notes.png
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input tap $((W*7/8)) $((H*15/16)); sleep 3; adb exec-out screencap -p > shots/screen_settings.png
            S=$(adb shell wm size | awk '{print $3}'); W=${S%x*}; H=${S#*x}; adb shell input keyevent KEYCODE_HOME; sleep 2; adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 400; sleep 3; adb exec-out screencap -p > shots/launcher_light.png
            adb shell cmd uimode night yes
            sleep 3
            adb exec-out screencap -p > shots/launcher_dark.png
            adb shell monkey -p dev.joyal.lodestill.debug -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 5
            adb exec-out screencap -p > shots/app_dark.png
            adb shell cmd uimode night no
            if [ -f /tmp/lodestill_test_failed ]; then echo "device tests FAILED"; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: testxml/
  sign:
    runs-on: ubuntu-latest
    needs: [test, apk, emulator]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Decode release keystore from secrets
        env:
          LODESTILL_KEYSTORE_B64: ${{ secrets.LODESTILL_KEYSTORE_B64 }}
        run: |
          echo "$LODESTILL_KEYSTORE_B64" | base64 -d > lodestill-release.jks
          chmod 600 lodestill-release.jks
      - name: Build signed release APK
        env:
          LODESTILL_STORE_PASSWORD: ${{ secrets.LODESTILL_STORE_PASSWORD }}
          LODESTILL_KEY_PASSWORD: ${{ secrets.LODESTILL_KEY_PASSWORD }}
          LODESTILL_KEY_ALIAS: ${{ secrets.LODESTILL_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify signature and record hash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -4
          sha256sum "$APK" | tee release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lodestill-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-sha256.txt
  release-verify:
    runs-on: ubuntu-latest
    needs: sign
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@v4
        with: { name: lodestill-release-apk }
      - name: Locate downloaded APK
        run: |
          find . -name "*.apk" -o -name "release-sha256.txt" | head -5
          APKPATH=$(find . -name "app-release.apk" | head -1)
          [ -n "$APKPATH" ] || exit 1
          cp "$APKPATH" ./app-release.apk
          ls -la app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app-release.apk || touch /tmp/lodestill_test_failed
            adb shell pm dump dev.joyal.lodestill | grep -m2 "versionName\|versionCode" || touch /tmp/lodestill_test_failed
            adb shell settings put global window_animation_scale 0; adb shell settings put global transition_animation_scale 0; adb shell settings put global animator_duration_scale 0
            adb shell monkey -p dev.joyal.lodestill -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 8
            FOCUS=$(adb shell dumpsys window | grep -E "mCurrentFocus"); echo "release focus: $FOCUS"
            echo "$FOCUS" | grep -q "dev.joyal.lodestill/dev.joyal.lodestill.MainActivity" || touch /tmp/lodestill_test_failed
            adb shell screencap -p /sdcard/release_light.png || touch /tmp/lodestill_test_failed
            # tap_text TEXT OUTFILE: dump UI up to 6 times, tap centre of first node whose text matches
            tap_text() {
              for n in 1 2 3 4 5 6; do
                adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
                adb pull /sdcard/ui.xml "$2" >/dev/null 2>&1
                B=$(python3 scripts/tapfind.py "$1" "$2")
                echo "tap '$1' attempt $n coords: [$B]"
                if [ -n "$B" ]; then adb shell input tap $B; sleep 3; return 0; fi
                sleep 3
              done
              return 1
            }
            tap_text "Start a session" ui1.xml || touch /tmp/lodestill_test_failed
            tap_text "Begin" ui2.xml || touch /tmp/lodestill_test_failed
            sleep 4
            adb shell uiautomator dump /sdcard/ui3.xml || touch /tmp/lodestill_test_failed
            adb pull /sdcard/ui3.xml ui3.xml || touch /tmp/lodestill_test_failed
            grep -q 'text="End early"' ui3.xml && grep -q 'text="Pause"' ui3.xml && echo "SESSION ACTIVE ON RELEASE APK" || { echo "session active markers missing"; touch /tmp/lodestill_test_failed; }
            adb shell screencap -p /sdcard/release_active.png || touch /tmp/lodestill_test_failed
            tap_text "Keep screen on" ui4.xml || touch /tmp/lodestill_test_failed
            sleep 2
            adb shell dumpsys window | grep -E "mCurrentFocus"
            adb shell dumpsys window | grep -E "FLAG_KEEP_SCREEN_ON|keepScreenOn" | head -3 || true
            adb shell screencap -p /sdcard/release_timer.png || touch /tmp/lodestill_test_failed
            adb shell settings put system ui_night_mode 2 || touch /tmp/lodestill_test_failed
            sleep 3
            adb shell monkey -p dev.joyal.lodestill -c android.intent.category.LAUNCHER 1 || touch /tmp/lodestill_test_failed
            sleep 4
            adb shell screencap -p /sdcard/release_dark.png || touch /tmp/lodestill_test_failed
            adb shell settings put system ui_night_mode 0 || true
            adb pull /sdcard/release_light.png . || touch /tmp/lodestill_test_failed
            adb pull /sdcard/release_active.png . || touch /tmp/lodestill_test_failed
            adb pull /sdcard/release_timer.png . || touch /tmp/lodestill_test_failed
            adb pull /sdcard/release_dark.png . || touch /tmp/lodestill_test_failed
            test ! -f /tmp/lodestill_test_failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-screenshots
          path: |
            release_light.png
            release_active.png
            release_timer.png
            release_dark.png
            ui1.xml
            ui2.xml
            ui3.xml
            ui4.xml
          if-no-files-found: warn
